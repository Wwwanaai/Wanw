<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wanw 自用图床</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:#f6f3fb;
  color:#29253a;
}

/* 顶部 */
.header{
  background:linear-gradient(135deg,#6d28d9,#a855f7,#c084fc);
  color:white;
  padding:28px 16px;
  box-shadow:0 5px 22px #6d28d933;
}

.header-inner{
  max-width:1100px;
  margin:auto;
}

.header h1{
  margin:0;
  font-size:24px;
  font-weight:700;
}

.header p{
  margin:7px 0 0;
  font-size:13px;
  opacity:.9;
}

/* 主体 */
.wrap{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:18px 14px 35px;
}

/* 卡片 */
.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 5px 24px #43206d0d;
}

h2{
  margin:0 0 14px;
  font-size:17px;
}

/* Token */
.token-row{
  display:flex;
  gap:10px;
  align-items:stretch;
}

.token-input{
  flex:1;
  min-width:0;
}

.token-input input{
  width:100%;
  height:44px;
  border:1px solid #ddd7ea;
  border-radius:11px;
  padding:0 13px;
  font-size:14px;
  outline:none;
}

.token-input input:focus{
  border-color:#8b5cf6;
  box-shadow:0 0 0 3px #8b5cf61a;
}

button{
  border:0;
  border-radius:11px;
  padding:10px 15px;
  cursor:pointer;
  font-weight:600;
  font-size:13px;
}

.primary{
  background:#7c3aed;
  color:white;
}

.primary:hover{
  background:#6d28d9;
}

.secondary{
  background:#eee9f7;
  color:#4c4264;
}

.secondary:hover{
  background:#e4ddf2;
}

.danger{
  background:#fee2e2;
  color:#b91c1c;
}

.note{
  font-size:12px;
  color:#777;
  line-height:1.7;
  margin-top:10px;
}

/* 上传区域 */
.upload{
  width:100%;
  min-height:190px;
  border:2px dashed #b9a0f5;
  border-radius:18px;
  padding:30px 15px;
  text-align:center;
  background:linear-gradient(180deg,#fcfaff,#f8f4ff);
  cursor:pointer;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  transition:.2s;
}

.upload:hover{
  background:#f4edff;
  border-color:#8b5cf6;
}

.upload-icon{
  width:54px;
  height:54px;
  border-radius:50%;
  background:#eee5ff;
  color:#7c3aed;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  margin-bottom:12px;
}

.upload strong{
  display:block;
  font-size:16px;
  margin-bottom:7px;
}

.upload small{
  color:#777;
  font-size:12px;
  line-height:1.6;
}

#fileInput{
  display:none;
}

/* 上传状态 */
#uploadStatus{
  width:100%;
}

.status{
  font-size:13px;
  margin-top:12px;
  word-break:break-word;
}

.progress{
  height:8px;
  background:#eee;
  border-radius:99px;
  overflow:hidden;
  margin-top:8px;
}

.bar{
  height:100%;
  background:linear-gradient(90deg,#7c3aed,#a855f7);
  width:0;
  transition:.2s;
}

/* 图库标题 */
.gallery-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.gallery-title h2{
  margin:0;
}

/* 图库 */
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:15px;
  margin-top:15px;
}

.item{
  border:1px solid #eee8f5;
  border-radius:16px;
  padding:12px;
  background:#fff;
  overflow:hidden;
  box-shadow:0 3px 12px #43206d08;
}

.thumb{
  height:180px;
  background:#f7f5fa;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  margin-bottom:11px;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.thumb audio{
  width:92%;
}

.filename{
  font-weight:600;
  font-size:14px;
  word-break:break-all;
  margin-bottom:8px;
}

.link{
  width:100%;
  font-size:12px;
  color:#666;
  background:#f8f7fa;
  border:1px solid #eee8f5;
  border-radius:9px;
  padding:9px;
  outline:none;
}

.actions{
  display:flex;
  gap:7px;
  margin-top:9px;
}

.actions button{
  flex:1;
  padding:9px 5px;
  font-size:12px;
}

.empty{
  text-align:center;
  color:#888;
  padding:35px 10px;
}

/* 手机端 */
@media(max-width:600px){

  .header{
    padding:23px 16px;
  }

  .header h1{
    font-size:21px;
  }

  .wrap{
    padding:13px 11px 30px;
  }

  .card{
    padding:15px;
    border-radius:16px;
  }

  /* Token 手机上上下排列 */
  .token-row{
    display:flex;
    flex-direction:column;
    gap:9px;
  }

  .token-input{
    width:100%;
  }

  .token-row button{
    width:100%;
    height:43px;
  }

  /* 上传区域 */
  .upload{
    min-height:175px;
    padding:25px 12px;
  }

  .upload-icon{
    width:48px;
    height:48px;
    font-size:22px;
  }

  .upload strong{
    font-size:15px;
  }

  .upload small{
    max-width:270px;
  }

  /* 图库标题 */
  .gallery-title{
    align-items:center;
  }

  .gallery-title button{
    white-space:nowrap;
  }

  /* 手机上单列 */
  .gallery{
    grid-template-columns:1fr;
    gap:13px;
  }

  .thumb{
    height:210px;
  }

  .actions button{
    padding:10px 4px;
  }
}

/* 很小的手机 */
@media(max-width:380px){

  .card{
    padding:13px;
  }

  .gallery-title h2{
    font-size:16px;
  }

  .gallery-title button{
    padding:8px 10px;
    font-size:12px;
  }
}
</style>
</head>

<body>

<div class="header">
  <div class="header-inner">
    <h1>Wanw 自用图床</h1>
    <p>GitHub Pages 图片 / 音频管理工具</p>
  </div>
</div>

<div class="wrap">

  <!-- Token -->
  <div class="card">

    <h2>① GitHub Token</h2>

    <div class="token-row">

      <div class="token-input">
        <input
          id="token"
          type="password"
          placeholder="粘贴 GitHub Personal Access Token"
        >
      </div>

      <button class="primary" onclick="saveToken()">
        保存 Token
      </button>

      <button class="secondary" onclick="clearToken()">
        清除 Token
      </button>

    </div>

    <div class="note">
      Token 只保存在当前浏览器的 localStorage 中。
      本页面不会把 Token 发送到除 GitHub API 以外的服务器。
    </div>

  </div>


  <!-- 上传 -->
  <div class="card">

    <h2>② 上传文件</h2>

    <label class="upload" for="fileInput">

      <div class="upload-icon">↑</div>

      <strong>点击选择文件，或把文件拖到这里</strong>

      <small>
        支持多选 · 图片：jpg / png / gif / webp / svg / bmp / ico
        <br>
        音频：mp3 / wav / m4a / ogg / flac / aac
      </small>

    </label>

    <input
      id="fileInput"
      type="file"
      multiple
      accept=".jpg,.jpeg,.png,.gif,.webp,.svg,.bmp,.ico,.mp3,.wav,.m4a,.ogg,.flac,.aac"
    >

    <div id="uploadStatus"></div>

  </div>


  <!-- 图库 -->
  <div class="card">

    <div class="gallery-title">

      <h2>③ 图库</h2>

      <button class="secondary" onclick="loadFiles()">
        刷新图库
      </button>

    </div>

    <div id="gallery" class="gallery">
      <div class="empty">
        点击“刷新图库”加载文件
      </div>
    </div>

  </div>


  <!-- 说明 -->
  <div class="card note">

    <b>使用说明：</b>

    先保存 GitHub Token，再上传文件。

    上传成功后会生成：

    <code>https://Wwwanaai.github.io/Wanw/文件名</code>

    格式的外链。

    <br>

    本工具直接通过 GitHub API 操作你的仓库。

  </div>

</div>


<script>

const GITHUB_USERNAME = "Wwwanaai";
const REPOSITORY = "Wanw";
const BRANCH = "main";

const BASE_URL =
  `https://${GITHUB_USERNAME}.github.io/${REPOSITORY}/`;

const IMAGE_EXT = [
  "jpg","jpeg","png","gif","webp","svg","bmp","ico"
];

const AUDIO_EXT = [
  "mp3","wav","m4a","ogg","flac","aac"
];

const tokenEl = document.getElementById("token");
const galleryEl = document.getElementById("gallery");
const fileInput = document.getElementById("fileInput");

tokenEl.value =
  localStorage.getItem("github_token") || "";


/* 提示 */
function toast(msg){

  const d = document.createElement("div");

  d.textContent = msg;

  Object.assign(d.style,{
    position:"fixed",
    right:"18px",
    bottom:"18px",
    background:"#29253a",
    color:"#fff",
    padding:"11px 15px",
    borderRadius:"10px",
    zIndex:9999,
    boxShadow:"0 5px 20px #0003",
    fontSize:"13px"
  });

  document.body.appendChild(d);

  setTimeout(()=>{
    d.remove();
  },2200);
}


/* 保存 Token */
function saveToken(){

  const t = tokenEl.value.trim();

  if(!t){
    toast("请先粘贴 Token");
    return;
  }

  localStorage.setItem("github_token",t);

  toast("Token 已保存");
}


/* 清除 Token */
function clearToken(){

  localStorage.removeItem("github_token");

  tokenEl.value="";

  toast("Token 已清除");
}


/* 获取 Token */
function getToken(){

  return localStorage.getItem("github_token")
    || tokenEl.value.trim();
}


/* 获取扩展名 */
function ext(name){

  return name
    .split(".")
    .pop()
    .toLowerCase();
}


/* GitHub API */
function api(path,options={}){

  const t=getToken();

  if(!t){
    throw new Error("请先保存 GitHub Token");
  }

  options.headers={
    ...(options.headers||{}),
    Authorization:`Bearer ${t}`,
    Accept:"application/vnd.github+json",
    "X-GitHub-Api-Version":"2022-11-28"
  };

  return fetch(
    "https://api.github.com"+path,
    options
  );
}


/* 文件转 Base64 */
function base64FromFile(file){

  return new Promise((resolve,reject)=>{

    const r=new FileReader();

    r.onload=()=>{
      resolve(
        r.result.split(",")[1]
      );
    };

    r.onerror=reject;

    r.readAsDataURL(file);

  });
}


/* 选择文件 */
fileInput.addEventListener(
  "change",
  e=>uploadFiles([...e.target.files])
);


/* 拖拽 */
const uploadBox =
  document.querySelector(".upload");

uploadBox.addEventListener(
  "dragover",
  e=>{
    e.preventDefault();
    uploadBox.style.background="#f0e9ff";
  }
);

uploadBox.addEventListener(
  "dragleave",
  ()=>{
    uploadBox.style.background="";
  }
);

uploadBox.addEventListener(
  "drop",
  e=>{

    e.preventDefault();

    uploadBox.style.background="";

    uploadFiles(
      [...e.dataTransfer.files]
    );

  }
);


/* 上传 */
async function uploadFiles(files){

  if(!files.length)return;

  if(!getToken()){
    toast("请先保存 Token");
    return;
  }

  const status =
    document.getElementById("uploadStatus");

  for(const file of files){

    const name =
      file.name.replace(/^\/+/,"");

    const id =
      "s"+Date.now()+
      Math.random().toString(16).slice(2);

    status.insertAdjacentHTML(
      "beforeend",
      `
      <div id="${id}" class="status">
        正在上传：${escapeHtml(name)}

        <div class="progress">
          <div class="bar"></div>
        </div>
      </div>
      `
    );

    const bar =
      document.querySelector(
        "#"+id+" .bar"
      );

    try{

      const content =
        await base64FromFile(file);

      bar.style.width="55%";

      const res =
        await api(
          `/repos/${encodeURIComponent(GITHUB_USERNAME)}/${encodeURIComponent(REPOSITORY)}/contents/${encodeURIComponent(name)}`,
          {
            method:"PUT",

            body:JSON.stringify({
              message:`Upload ${name}`,
              content,
              branch:BRANCH
            })
          }
        );

      if(!res.ok){

        const j =
          await res.json().catch(()=>({}));

        throw new Error(
          j.message ||
          `HTTP ${res.status}`
        );
      }

      bar.style.width="100%";

      document
        .getElementById(id)
        .insertAdjacentHTML(
          "beforeend",
          `<span style="color:#15803d">　上传成功</span>`
        );

    }catch(e){

      document
        .getElementById(id)
        .insertAdjacentHTML(
          "beforeend",
          `<span style="color:#b91c1c">　失败：${escapeHtml(e.message)}</span>`
        );

    }

  }

  fileInput.value="";

  setTimeout(
    loadFiles,
    500
  );
}


/* 加载图库 */
async function loadFiles(){

  galleryEl.innerHTML=
    '<div class="empty">正在加载……</div>';

  try{

    const res =
      await api(
        `/repos/${encodeURIComponent(GITHUB_USERNAME)}/${encodeURIComponent(REPOSITORY)}/contents?ref=${encodeURIComponent(BRANCH)}`
      );

    if(!res.ok){

      const j =
        await res.json().catch(()=>({}));

      throw new Error(
        j.message ||
        `HTTP ${res.status}`
      );
    }

    const files =
      await res.json();

    const usable =
      files.filter(
        x =>
          x.type==="file" &&
          [
            ...IMAGE_EXT,
            ...AUDIO_EXT
          ].includes(ext(x.name))
      );

    if(!usable.length){

      galleryEl.innerHTML=
        '<div class="empty">暂时还没有图片或音频</div>';

      return;
    }

    galleryEl.innerHTML="";

    usable.forEach(renderItem);

  }catch(e){

    galleryEl.innerHTML=
      `
      <div class="empty">
        加载失败：${escapeHtml(e.message)}
        <br>
        <small>
          请检查 Token、用户名、仓库名和 Pages 设置。
        </small>
      </div>
      `;
  }
}


/* 图库卡片 */
function renderItem(file){

  const e=ext(file.name);

  const url =
    BASE_URL +
    encodeURIComponent(file.name);

  const item =
    document.createElement("div");

  item.className="item";


  const thumb =
    document.createElement("div");

  thumb.className="thumb";


  if(IMAGE_EXT.includes(e)){

    const img =
      document.createElement("img");

    img.src=url;

    img.alt=file.name;

    img.onerror=()=>{

      img.style.display="none";

      thumb.textContent=
        "图片正在由 Pages 发布……";

    };

    thumb.appendChild(img);

  }else{

    const a =
      document.createElement("audio");

    a.controls=true;

    a.src=url;

    thumb.appendChild(a);
  }


  const name =
    document.createElement("div");

  name.className="filename";

  name.textContent=file.name;


  const link =
    document.createElement("input");

  link.className="link";

  link.type="text";

  link.value=url;

  link.readOnly=true;


  const actions =
    document.createElement("div");

  actions.className="actions";


  const copy =
    document.createElement("button");

  copy.className="secondary";

  copy.textContent="复制";

  copy.onclick=async()=>{

    await navigator.clipboard.writeText(url);

    toast("链接已复制");

  };


  const open =
    document.createElement("button");

  open.className="secondary";

  open.textContent="打开";

  open.onclick=()=>{

    window.open(
      url,
      "_blank"
    );

  };


  const del =
    document.createElement("button");

  del.className="danger";

  del.textContent="删除";

  del.onclick=()=>deleteFile(file);


  actions.append(
    copy,
    open,
    del
  );

  item.append(
    thumb,
    name,
    link,
    actions
  );

  galleryEl.appendChild(item);
}


/* 删除 */
async function deleteFile(file){

  if(!confirm(
    `确定删除 ${file.name} 吗？`
  ))return;

  try{

    const res =
      await api(
        `/repos/${encodeURIComponent(GITHUB_USERNAME)}/${encodeURIComponent(REPOSITORY)}/contents/${encodeURIComponent(file.name)}`,
        {
          method:"DELETE",

          body:JSON.stringify({
            message:`Delete ${file.name}`,
            sha:file.sha,
            branch:BRANCH
          })
        }
      );

    if(!res.ok){

      const j =
        await res.json().catch(()=>({}));

      throw new Error(
        j.message ||
        `HTTP ${res.status}`
      );
    }

    toast("删除成功");

    loadFiles();

  }catch(e){

    toast(
      "删除失败："+e.message
    );

  }
}


/* 防止 HTML 注入 */
function escapeHtml(s){

  return String(s).replace(
    /[&<>"']/g,
    c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );

}

</script>

</body>
</html>
